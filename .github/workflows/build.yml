name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build static binary
        run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --target x86_64-unknown-linux-musl --release

      - name: Verify static binary
        run: |
          file target/x86_64-unknown-linux-musl/release/yubicli
          ldd target/x86_64-unknown-linux-musl/release/yubicli || true
          target/x86_64-unknown-linux-musl/release/yubicli --version
